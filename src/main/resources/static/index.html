<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thong Tin Sinh Vien</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0f2fe, var(--bg));
            color: var(--text);
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        p {
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 12px;
        }

        .info {
            list-style: none;
            text-align: left;
            margin-top: 12px;
        }

        .info li {
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
            color: var(--text);
        }

        .info li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>Thông Tin Sinh Viên</h1>
        <p>Các thông tin cơ bản:</p>
        <ul class="info">
            <li>Mã số Sinh viên: 2280601898</li>
            <li>Tên: Vũ Đức Mạnh</li>
            <li>Lớp: 22DTHG</li>
            <li>Chuyên Ngành: Công nghệ phần mềm</li>
        </ul>
    </main>
</body>
</html>
